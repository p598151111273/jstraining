name: 每日签到
on:
  schedule:
    # UTC 0点 = 北京时间早上8点；修改这里可以改时间
    - cron: '0 0 * * *'
  workflow_dispatch: # ✅ 可以手动点按钮测试任务

jobs:
  run-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 调用签到POST接口
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.TOKEN }}" \
            -H "Content-Type: application/json" \
            https://sidrune.ai/api/v1/welfare/checkin
